# NOTE: the image field uses ${ACR_LOGIN_SERVER} and ${IMAGE_TAG} variables.
# The CI pipeline runs `envsubst` on the manifests before `kubectl apply`,
# so the deployed image always matches the exact build that just ran.
# Example after substitution:
#   image: acrblueprintdev.azurecr.io/hello-api:abc1234
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: blueprint
  labels:
    app.kubernetes.io/name: hello-api
    app.kubernetes.io/part-of: cloud-native-blueprint
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-api
        app.kubernetes.io/part-of: cloud-native-blueprint
    spec:
      containers:
        - name: hello-api
          image: ${ACR_LOGIN_SERVER}/hello-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          envFrom:
            - configMapRef:
                name: hello-api-config
            - secretRef:
                name: hello-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The /healthz endpoint backs both probes; a failing health check
          # restarts the container, a failing readiness check pulls it
          # out of the Service endpoints.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
